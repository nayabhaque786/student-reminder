<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudyMate - Timetable</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4f46e5"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✓</div><div><b>StudyMate</b><small>Student Planner</small></div></div><nav><a href="index.html">🏠 Dashboard</a><a href="reminders.html">🔔 Reminders</a><a href="timetable.html">🗓️ Timetable</a><a href="notes.html">📝 Notes</a><a href="profile.html">👤 Profile</a></nav></aside><main class="main"><header><div><h1>🗓️ Timetable</h1><p>Organize your weekly classes and study sessions.</p></div><button class="themebtn" id="themeToggle" title="Toggle dark mode">🌙</button></header><section class="card"><h3>Add Class</h3><form id="classForm" class="formgrid"><input id="className" placeholder="Class / Subject" required><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><input id="time" type="time" required><input id="room" placeholder="Room / Location"><button class="primary" type="submit">+ Add Class</button></form></section><div class="filterbar"><select id="dayFilter"><option value="all">All Days</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></div><section class="week" id="timetable"></section></main></div><script src="script.js"></script></body></html>
