<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudyMate - Reminders</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4f46e5"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✓</div><div><b>StudyMate</b><small>Student Planner</small></div></div><nav><a href="index.html">🏠 Dashboard</a><a href="reminders.html">🔔 Reminders</a><a href="timetable.html">🗓️ Timetable</a><a href="notes.html">📝 Notes</a><a href="profile.html">👤 Profile</a></nav></aside><main class="main"><header><div><h1>🔔 Reminders</h1><p>Never miss an assignment or deadline.</p></div><button class="themebtn" id="themeToggle" title="Toggle dark mode">🌙</button></header><section class="card"><h3>Add a Reminder</h3><form id="reminderForm" class="formgrid"><input id="title" placeholder="Task / assignment" required><input id="subject" placeholder="Subject"><input id="date" type="date" required><select id="priority"><option value="low">Low Priority</option><option value="medium" selected>Medium Priority</option><option value="high">High Priority</option></select><button class="primary" type="submit">+ Add Reminder</button></form></section><div class="toolbar"><h3>My Reminders</h3><div><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="pending">Pending</button><button class="filter" data-filter="completed">Completed</button></div></div>
<div class="filterbar"><select id="filterSubject"><option value="all">All Subjects</option></select><select id="filterPriority"><option value="all">All Priorities</option><option value="low">Low Priority</option><option value="medium">Medium Priority</option><option value="high">High Priority</option></select><select id="sortBy"><option value="date-asc">Sort: Date (Soonest)</option><option value="date-desc">Sort: Date (Latest)</option><option value="priority">Sort: Priority (High→Low)</option><option value="title">Sort: Title (A→Z)</option></select></div><section id="reminderList"></section></main></div><script src="script.js"></script></body></html>
